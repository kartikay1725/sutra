services:
  postgres:
    image: postgres:17
    container_name: sutra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sutra
      POSTGRES_PASSWORD: sutra_dev_password
      POSTGRES_DB: sutra
    ports:
      - "55432:5432"
    volumes:
      - sutra_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sutra -d sutra"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: sutra-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - sutra_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sutra_postgres_data:
  sutra_redis_data:
